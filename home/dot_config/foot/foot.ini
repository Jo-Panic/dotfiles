# ── foot (portage macOS : brew install --cask gobijan/tap/foot) ──
# Réservé aux fenêtres temporaires (mises à jour…) ; Ghostty reste le
# terminal de travail. Mêmes réglages visuels que Ghostty : Catppuccin
# Mocha, police en 14 pt.
#
# Les fenêtres dédiées ont leur propre .ini (updatestui.ini…), qui
# inclut celui-ci, comme sous Arch.
#
# View > Theme réécrit la ligne include= ci-dessous : un choix fait par
# le menu serait écrasé au prochain chezmoi apply (le modifier ici).

# monospace : SF Mono s'il est installé, sinon Menlo ; foot va chercher
# lui-même les glyphes manquants dans les Nerd Fonts installées.
font=monospace:size=14

# Le thème fourni avec foot.app (même fichier que celui du menu).
include=/Applications/foot.app/Contents/Resources/themes/catppuccin-mocha

# Mocha n'a que des couleurs sombres : sans ces deux lignes, foot
# suivrait l'apparence de macOS et passerait au thème clair par défaut
# (Grok Day) en mode clair.
macos-follow-appearance=no
initial-color-theme=dark
