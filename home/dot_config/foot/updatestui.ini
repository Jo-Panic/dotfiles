# ── foot : session de mise à jour Homebrew ───────────────────
# Lancé par ~/.config/sketchybar/plugins/updates-tui.sh
# (foot --config=… --title=updates). Pendant de updatestui.ini sous Arch.

include=~/.config/foot/foot.ini

# En caractères plutôt qu'en pixels : la taille suit la police, quel que
# soit l'écran. foot centre la fenêtre ; yabai la laisse flottante
# (règle app="^foot$" manage=off).
initial-window-size-chars=120x34

# Le titre « updates » sert à retrouver la fenêtre (focus-or-launch) :
# les programmes ne peuvent pas le changer.
locked-title=yes

# Le script tourne sous le /bin/bash 3.2 de macOS, que l'intégration
# shell de foot ne prend pas en charge.
macos-shell-integration=no
